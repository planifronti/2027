<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Planifronti 2026</title>
<style>
:root { --bg:#f3f5f8; --card:#fff; --fg:#16202c; --muted:#5b6878; --line:#d3dae4; --accent:#0a5fa8; --bad:#c62828; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f151d; --card:#161e29; --fg:#e5ebf2; --muted:#93a1b3; --line:#2b3746; --accent:#5aa9ec; --bad:#ff6b6b; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.45 system-ui, "Segoe UI", Arial, sans-serif; display:grid; place-items:center; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--card); border:1px solid var(--line); border-radius: 10px; padding: 28px 24px; display:grid; gap: 14px; }
h1 { margin:0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
p { margin:0; color: var(--muted); font-size: 14px; }
label { font-size: 13px; font-weight: 600; }
input[type=password] { width:100%; font: inherit; padding: 10px 12px; border:1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display:flex; align-items:center; gap:8px; font-size: 14px; color: var(--muted); }
button { font: inherit; font-weight: 600; padding: 10px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Planifronti <span>2026</span></h1>
  <p>Ce planning est protégé. Entrez le mot de passe de l'équipe pour l'afficher.</p>
  <div style="display:grid;gap:6px">
    <label for="pwd">Mot de passe</label>
    <input type="password" id="pwd" autocomplete="current-password" required autofocus>
  </div>
  <label class="row"><input type="checkbox" id="remember" checked> Se souvenir de moi sur cet appareil</label>
  <button type="submit" id="go">Ouvrir le planning</button>
  <div class="err" id="err" role="alert"></div>
</form>

const KEY_NAME = "planifronti-cle";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function openWith(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.d));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function derive(pwd) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.s), iterations: P.n }, base, 256);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_NAME); } catch (e) {}
  if (saved) {
    try { await openWith(b64(saved)); return; } catch (e) { try { localStorage.removeItem(KEY_NAME); } catch (e2) {} }
  }
  const f = document.getElementById("f");
  f.hidden = false;
  document.getElementById("pwd").focus();
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "Ouverture…"; err.textContent = "";
    try {
      const remember = document.getElementById("remember").checked;
      const raw = await derive(document.getElementById("pwd").value);
      // Vérifie le mot de passe avant de remplacer la page
      const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      try { await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.d)); } catch (e) { throw new Error("bad"); }
      if (remember) { try { localStorage.setItem(KEY_NAME, toB64(raw)); } catch (e) {} }
      await openWith(raw);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Ouvrir le planning";
      err.textContent = "Mot de passe incorrect. Vérifiez les majuscules et réessayez.";
      document.getElementById("pwd").select();
    }
  });
})();
</script>
